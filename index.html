<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload de Fotos e Vídeos</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b1329;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .card {
      background-color: #17223b;
      padding: 28px 24px;
      border-radius: 20px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    h2 { margin: 0; font-size: 22px; font-weight: 700; }
    p.desc { font-size: 14px; color: #94a3b8; margin: 0; }
    
    .file-dropzone {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 2px dashed #334155;
      border-radius: 14px;
      padding: 24px 16px;
      cursor: pointer;
      background-color: #0f172a;
      transition: border-color 0.2s, background-color 0.2s;
    }
    .file-dropzone:hover {
      border-color: #38bdf8;
      background-color: #131d33;
    }
    .file-dropzone svg {
      width: 42px;
      height: 42px;
      stroke: #94a3b8;
      margin-bottom: 10px;
    }
    .file-dropzone span {
      font-size: 14px;
      color: #cbd5e1;
      word-break: break-word;
    }
    input[type="file"] { display: none; }
    
    .btn {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      background-color: #0284c7;
      color: #fff;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
    }
    .btn:hover { background-color: #0369a1; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Barra de Progresso */
    .progress-container {
      display: none;
      width: 100%;
      background-color: #0f172a;
      border-radius: 10px;
      padding: 12px;
      border: 1px solid #334155;
      text-align: left;
    }
    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #cbd5e1;
      margin-bottom: 6px;
    }
    .progress-track {
      width: 100%;
      height: 10px;
      background-color: #1e293b;
      border-radius: 6px;
      overflow: hidden;
    }
    .progress-bar {
      width: 0%;
      height: 100%;
      background-color: #38bdf8;
      border-radius: 6px;
      transition: width 0.3s ease;
    }
    
    #status {
      font-size: 13px;
      color: #94a3b8;
      min-height: 18px;
      word-break: break-word;
    }

    /* Caixa de resultado */
    .result-box {
      display: none;
      padding: 14px;
      background-color: #0f172a;
      border-radius: 10px;
      border: 1px solid #22c55e;
      text-align: left;
    }
    .result-box label { font-size: 12px; color: #22c55e; font-weight: 700; }
    .link-wrapper {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }
    .link-wrapper input {
      flex: 1;
      padding: 8px;
      font-size: 13px;
      border-radius: 6px;
      border: 1px solid #475569;
      background-color: #1e293b;
      color: #fff;
      outline: none;
    }
    .copy-btn {
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      background-color: #0284c7;
      color: #fff;
      cursor: pointer;
    }
    .copy-btn:hover { background-color: #0369a1; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Enviar Foto ou Vídeo</h2>
    <p class="desc">Envie um arquivo para gerar um link de acesso no Google Drive.</p>

    <!-- Dropzone de Arquivos -->
    <label class="file-dropzone" for="fileInput">
      <svg fill="none" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
      </svg>
      <span id="labelTxt">Toque para selecionar da galeria ou câmera</span>
    </label>
    <input type="file" id="fileInput" accept="image/*,video/*">

    <!-- Barra de Progresso Visual -->
    <div class="progress-container" id="progressContainer">
      <div class="progress-header">
        <span id="progressStatus">Preparando...</span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </div>

    <button class="btn" id="btnUpload" disabled>Enviar Arquivo</button>
    <div id="status"></div>

    <!-- Bloco com Link Gerado -->
    <div class="result-box" id="resultBox">
      <label>LINK PÚBLICO GERADO:</label>
      <div class="link-wrapper">
        <input type="text" id="shareUrl" readonly>
        <button class="copy-btn" id="btnCopy">Copiar</button>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // COLE AQUI SUA URL DO APPS SCRIPT (Ela DEVE terminar em /exec)
    // =========================================================================
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzNN7dXLIUIkluMZktduJ1CBijA3WrXjnoYauv1GuuODrd7m8kySbu2WtIPBD4RrnvYYg/exec";

    const fileInput = document.getElementById('fileInput');
    const labelTxt = document.getElementById('labelTxt');
    const btnUpload = document.getElementById('btnUpload');
    const statusText = document.getElementById('status');
    const resultBox = document.getElementById('resultBox');
    const shareUrl = document.getElementById('shareUrl');
    const btnCopy = document.getElementById('btnCopy');

    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const progressStatus = document.getElementById('progressStatus');
    const progressPercent = document.getElementById('progressPercent');

    let selectedFile = null;

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        selectedFile = e.target.files[0];
        
        if (selectedFile.size > 45 * 1024 * 1024) {
          alert("O arquivo é muito grande. O limite máximo é de 45 MB.");
          fileInput.value = "";
          selectedFile = null;
          labelTxt.textContent = "Toque para selecionar da galeria ou câmera";
          btnUpload.disabled = true;
          return;
        }

        labelTxt.textContent = "Selecionado: " + selectedFile.name;
        btnUpload.disabled = false;
        resultBox.style.display = "none";
        progressContainer.style.display = "none";
        statusText.textContent = "";
      }
    });

    function setProgress(pct, msg) {
      progressBar.style.width = pct + "%";
      progressPercent.textContent = pct + "%";
      if (msg) progressStatus.textContent = msg;
    }

    btnUpload.addEventListener('click', () => {
      if (!selectedFile) return;

      btnUpload.disabled = true;
      resultBox.style.display = "none";
      progressContainer.style.display = "block";
      setProgress(15, "Lendo arquivo local...");

      const reader = new FileReader();

      reader.onload = async () => {
        setProgress(40, "Enviando para o Google Drive...");

        const rawBase64 = reader.result.toString();
        const base64Data = rawBase64.indexOf(',') > -1 ? rawBase64.split(',')[1] : rawBase64;

        const payload = {
          fileName: selectedFile.name,
          mimeType: selectedFile.type || "application/octet-stream",
          base64Data: base64Data
        };

        // Simula progresso intermediário enquanto o Drive processa
        let fakeProgress = 40;
        const progressInterval = setInterval(() => {
          if (fakeProgress < 90) {
            fakeProgress += 5;
            setProgress(fakeProgress, "Processando no Drive...");
          }
        }, 500);

        try {
          const response = await fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
          });
          
          clearInterval(progressInterval);

          const rawText = await response.text();
          let result;

          try {
            result = JSON.parse(rawText);
          } catch (e) {
            throw new Error("O Google retornou uma resposta inesperada. Verifique se as permissões estão como 'Qualquer pessoa'. Resposta: " + rawText.substring(0, 80));
          }

          if (result.status === 'success') {
            setProgress(100, "Concluído!");
            shareUrl.value = result.fileUrl;
            resultBox.style.display = "block";
            statusText.textContent = "";
          } else {
            setProgress(0, "Falhou.");
            statusText.textContent = "Erro retornado: " + result.message;
            btnUpload.disabled = false;
          }
        } catch (error) {
          clearInterval(progressInterval);
          setProgress(0, "Erro");
          statusText.textContent = error.message;
          btnUpload.disabled = false;
        }
      };

      reader.onerror = () => {
        setProgress(0, "Erro");
        statusText.textContent = "Falha ao ler o arquivo no celular.";
        btnUpload.disabled = false;
      };

      reader.readAsDataURL(selectedFile);
    });

    btnCopy.addEventListener('click', () => {
      shareUrl.select();
      navigator.clipboard.writeText(shareUrl.value).then(() => {
        btnCopy.textContent = "Copiado!";
        setTimeout(() => { btnCopy.textContent = "Copiar"; }, 2000);
      });
    });
  </script>
</body>
</html>
