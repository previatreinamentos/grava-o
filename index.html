<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload de Fotos e Vídeos</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background-color: #1e293b;
      padding: 32px;
      border-radius: 16px;
      width: 100%;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }
    h2 { margin-top: 0; margin-bottom: 8px; font-size: 22px; }
    p.desc { font-size: 14px; color: #94a3b8; margin-bottom: 24px; }
    
    .file-dropzone {
      border: 2px dashed #475569;
      border-radius: 12px;
      padding: 28px 16px;
      cursor: pointer;
      transition: border-color 0.2s, background-color 0.2s;
      margin-bottom: 20px;
    }
    .file-dropzone:hover {
      border-color: #38bdf8;
      background-color: #1e293b80;
    }
    .file-dropzone span {
      display: block;
      font-size: 14px;
      color: #cbd5e1;
      margin-top: 8px;
    }
    input[type="file"] { display: none; }
    
    .btn {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      background-color: #0284c7;
      color: #fff;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
    }
    .btn:hover { background-color: #0369a1; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    
    #status {
      margin-top: 18px;
      font-size: 14px;
      color: #94a3b8;
      min-height: 20px;
      word-break: break-word;
    }

    .result-box {
      display: none;
      margin-top: 20px;
      padding: 16px;
      background-color: #0f172a;
      border-radius: 8px;
      border: 1px solid #334155;
      text-align: left;
    }
    .result-box label { font-size: 12px; color: #38bdf8; font-weight: bold; }
    .link-wrapper {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }
    .link-wrapper input {
      flex: 1;
      padding: 8px;
      font-size: 13px;
      border-radius: 6px;
      border: 1px solid #475569;
      background-color: #1e293b;
      color: #fff;
      outline: none;
    }
    .copy-btn {
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      background-color: #334155;
      color: #fff;
      cursor: pointer;
    }
    .copy-btn:hover { background-color: #475569; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Enviar Foto ou Vídeo</h2>
    <p class="desc">Envie um arquivo para gerar um link de acesso no Google Drive.</p>

    <!-- Área de seleção do arquivo -->
    <label class="file-dropzone" for="fileInput">
      <svg width="40" height="40" fill="none" stroke="#94a3b8" viewBox="0 0 24 24" style="margin: auto; display: block;">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
      </svg>
      <span id="labelTxt">Toque para selecionar da galeria ou câmera</span>
    </label>
    <input type="file" id="fileInput" accept="image/*,video/*">

    <button class="btn" id="btnUpload" disabled>Enviar Arquivo</button>

    <div id="status"></div>

    <!-- Caixa exibida quando o upload for concluído -->
    <div class="result-box" id="resultBox">
      <label>LINK PÚBLICO GERADO:</label>
      <div class="link-wrapper">
        <input type="text" id="shareUrl" readonly>
        <button class="copy-btn" id="btnCopy">Copiar</button>
      </div>
    </div>
  </div>

  <script>
    // =====================================================================
    // COLE AQUI A URL DE IMPLANTAÇÃO DA SUA WEB APP DO APPS SCRIPT:
    // =====================================================================
    const SCRIPT_URL = "SUA_URL_DO_APPS_SCRIPT_AQUI";

    const fileInput = document.getElementById('fileInput');
    const labelTxt = document.getElementById('labelTxt');
    const btnUpload = document.getElementById('btnUpload');
    const statusText = document.getElementById('status');
    const resultBox = document.getElementById('resultBox');
    const shareUrl = document.getElementById('shareUrl');
    const btnCopy = document.getElementById('btnCopy');

    let selectedFile = null;

    // Detecta arquivo selecionado
    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        selectedFile = e.target.files[0];
        
        // Alerta se passar do limite de tamanho suportado pelo Apps Script (~40MB)
        if (selectedFile.size > 40 * 1024 * 1024) {
          alert("O arquivo é muito grande. Escolha um arquivo de até 40 MB.");
          fileInput.value = "";
          selectedFile = null;
          labelTxt.textContent = "Toque para selecionar da galeria ou câmera";
          btnUpload.disabled = true;
          return;
        }

        labelTxt.textContent = "Arquivo: " + selectedFile.name;
        btnUpload.disabled = false;
        resultBox.style.display = "none";
        statusText.textContent = "";
      }
    });

    // Envio do arquivo
    btnUpload.addEventListener('click', () => {
      if (!selectedFile) return;

      btnUpload.disabled = true;
      statusText.textContent = "Lendo arquivo...";
      resultBox.style.display = "none";

      const reader = new FileReader();

      reader.onload = async () => {
        statusText.textContent = "Enviando para o Drive e gerando link público...";

        const rawBase64 = reader.result.toString();
        const base64Data = rawBase64.indexOf(',') > -1 ? rawBase64.split(',')[1] : rawBase64;

        const payload = {
          fileName: selectedFile.name,
          mimeType: selectedFile.type || "application/octet-stream",
          base64Data: base64Data
        };

        try {
          const response = await fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
          });
          const result = await response.json();

          if (result.status === 'success') {
            statusText.textContent = "Envio concluído com sucesso!";
            shareUrl.value = result.fileUrl;
            resultBox.style.display = "block";
          } else {
            statusText.textContent = "Erro no envio: " + result.message;
            btnUpload.disabled = false;
          }
        } catch (error) {
          statusText.textContent = "Erro de conexão: " + error.message;
          btnUpload.disabled = false;
        }
      };

      reader.onerror = () => {
        statusText.textContent = "Erro ao ler o arquivo no aparelho.";
        btnUpload.disabled = false;
      };

      reader.readAsDataURL(selectedFile);
    });

    // Botão de copiar link
    btnCopy.addEventListener('click', () => {
      shareUrl.select();
      navigator.clipboard.writeText(shareUrl.value).then(() => {
        btnCopy.textContent = "Copiado!";
        setTimeout(() => { btnCopy.textContent = "Copiar"; }, 2000);
      });
    });
  </script>
</body>
</html>
